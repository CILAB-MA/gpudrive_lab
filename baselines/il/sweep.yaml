program: baselines/il/il.py
method: grid
name: exp_10000_only_goal
metric:
  goal: minimize
  name: eval/loss
parameters:
  model_name:
    values: ["early_attn"]
  seed:
    values: [3, 11, 42, 0, 7]
  num_scene:
    values: [10000]
  total_gradient_steps:
    values: [400000]
  # ILCONFIG
  network_dim:
    values: [128]
  head_dim:
    values: [64]
  num_layer:
    values: [[4, 3]]
