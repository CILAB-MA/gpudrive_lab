program: baselines/il/il.py
method: grid
name: exp_80000_subset
metric:
  goal: minimize
  name: eval/loss
parameters:
  data_path:
    values: ['processed/training_subset_v5']
  model_name:
    values: ["early_attn"]
  seed:
    values: [3, 11, 42]
  num_scene:
    values: [80000]
  total_gradient_steps:
    values: [1000000]
  # ILCONFIG
  network_dim:
    values: [128]
  head_dim:
    values: [64]
  num_layer:
    values: [[4, 3]]
