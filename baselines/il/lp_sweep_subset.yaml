    values: ['early_lp', 'final_lp', 'baseline']
  # EXPERIMENT
  batch_size:
    values: [256]
  total_gradient_steps:
    values: [100_000]
  lr:
    values: [0.0015]
  seed:
    values: [3, 11, 42]
