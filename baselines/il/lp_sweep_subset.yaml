program: baselines/il/lp_subset.py
method: grid
name: lp_20000_subset_test
metric:
  goal: minimize
  name: eval/loss
parameters:
  # MODEL
  data_path:
    values: ['processed/training_subset_v5']
  model_path:
    value: "/data/full_version/model/exp_20000"
  model_name:
    values: ["early_attn_s3_0825_044522"]
  # DATA
  future_step:
    values: [10, 20, 30, 40]
