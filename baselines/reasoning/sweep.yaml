program: baselines/reasoning/aux.py
method: grid
name: log_replay
metric:
  goal: minimize
  name: eval/loss
parameters:
  seed:
    values: [3, 11, 42]
  num_scene:
    values: [80000]
  total_gradient_steps:
    values: [150000]
  # ILCONFIG
  network_dim:
    values: [128]
  head_dim:
    values: [64]
  num_layer:
    values: [[5, 4]]
  # AUXCONFIG
  exp:
    values: ["vanilla", "baseline"] # baseline, vanilla, neg, pcgrad, neg_pcgrad