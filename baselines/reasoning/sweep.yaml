    values: [3, 11, 42, 0]
  num_scene:
    values: [80000]
  total_gradient_steps:
    values: [150000]
  # ILCONFIG
  network_dim:
    values: [128]
  head_dim:
    values: [64]
  num_layer:
    values: [[4, 3]]
  # AUXCONFIG
  exp:
    values: ["vanilla"] # baseline, vanilla, neg, pcgrad, neg_pcgrad